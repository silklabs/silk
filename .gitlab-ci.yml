image: walac/silkdev:latest

variables:
  TRAVIS_BRANCH: "$CI_BUILD_REF_NAME"
  TRAVIS_BUILD_DIR: "$CI_PROJECT_DIR"
  TRAVIS_COMMIT: "$CI_BUILD_REF"
  TRAVIS_OS_NAME: "linux"
  TRAVIS_PULL_REQUEST: "false"
  TRAVIS_BUILD_ID: "$CI_BUILD_ID"
  TRAVIS_JOB_ID: "$CI_PIPELINE_ID"
  TRAVIS_REPO_SLUG: "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
  TRAVIS: "true"
  BOARD: "kenzo"
  PRODUCT: "silk"
  PREBUILT_CCACHE: "prebuilts/misc/linux-x86/ccache/ccache"

before_script:
  - source $NVM_DIR/nvm.sh
  - cd device
  - source ../pub/travis/common_before_install.sh
  - export CXX="g++-4.8" CC="gcc-4.8"
  - source travis/before_script

run_build:
  script:
    - echo For full build logs and other artifacts, please see $ARTIFACT_WEBHOST/$ARTIFACT_REMOTE_PATH
    - travis/log travis/script
    - travis/after_success

after_script:
  - source $NVM_DIR/nvm.sh
  - cd device
  - source travis/artifacts
  - travis/after_script

