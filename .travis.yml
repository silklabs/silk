os:
  - linux
  - osx

before_install:
  - git config --global user.email "shipit@silklabs.com"
  - git config --global user.name "Release Engineering"
  - git config --global color.ui false
  - if [ $TRAVIS_OS_NAME == osx ]; then
      brew update;
      brew install nvm;
      source $(brew --prefix nvm)/nvm.sh;
    fi
  - npm install

script:
  - npm test

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-releng"
  region: us-west-1
  skip_cleanup: true
  acl: public_read
  local-dir: deploy/
  upload-dir: $TRAVIS_BRANCH
  on:
    all_branches: true
    condition: $DEPLOY = true
