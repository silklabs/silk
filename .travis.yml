language: c
compiler: gcc
jdk:
  - openjdk7

cache:
  directories:
    - $HOME/.ccache

addons:
  apt:
    packages:
      - g++
      - libc6:i386
      - libstdc++6:i386
      - linux-libc-dev

notifications:
  slack:
    on_success: change
    on_failure: always
    rooms:
      - silklabs:rQg7Mb0R1AqJ43FAJzkRaNdS

env:
  global:
    - REPO_INIT_ARGS="--depth=1"
  matrix:
    - GONK=mako
    - GONK=qemu

before_script:
  - git config --global user.email "engineering@silklabs.com"
  - git config --global user.name "Travis CI"
  - git config --global color.ui false
  - nvm install 0.12
  - jdk_switcher use openjdk7
  - .travis/before_script

script:
  - .travis/script

after_script:
  - .travis/after_script

before_deploy:
  - .travis/before_deploy

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-device"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
