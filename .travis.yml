language: c
compiler: gcc

cache:
  directories:
    - $HOME/.ccache
    - .repo/projects
    - .repo/project-objects

addons:
  apt:
    packages:
      - g++
      - libc6:i386
      - libstdc++6:i386
      - linux-libc-dev

before_script:
  - ccache -s
  - git config --global user.email "engineering@silklabs.com"
  - git config --global user.name "Travis CI"
  - git config --global color.ui false
  - nvm install 0.12

script:
  - make sync
  - cp $(which ccache) prebuilts/misc/linux-x86/ccache/ccache
  - BUILD_HOST_64bit=1 make

after_script:
  - ccache -s

notifications:
  email:
    - engineering@silklabs.com
