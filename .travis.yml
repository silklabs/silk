language: c
compiler: gcc

os:
  - linux
  - osx

jdk:
  - openjdk7

cache:
  directories:
    - $HOME/.ccache

addons:
  apt:
    packages:
      - g++
      - libc6:i386
      - libstdc++6:i386
      - linux-libc-dev

notifications:
  slack:
    on_success: change
    on_failure: always
    rooms:
      - silklabs:rQg7Mb0R1AqJ43FAJzkRaNdS

env:
  matrix:
    - GONK_SPEC=mako
    - GONK_SPEC=qemu

before_script:
  - source .travis/shared
  - if [[ $GONK == nop ]]; then
        echo Nothing to do;
        exit 0;
    fi
  - git config --global user.email "engineering@silklabs.com"
  - git config --global user.name "Travis CI"
  - git config --global color.ui false
  - if [ $TRAVIS_OS_NAME == osx ]; then
        brew install ccache nvm;
        source $(brew --prefix nvm)/nvm.sh;
        export CI_IGNORE_CASE_INSENSITIVE_FS=please;
    else
        jdk_switcher use openjdk7;
    fi
  - nvm install 0.12
  - if [ $TRAVIS_OS_NAME == osx ]; then
        echo Reclaim disk space after building node from source;
        rm -rf /usr/local/Cellar/nvm/0.17.2/src/node-v0.12.*;
    fi
  - .travis/before_script

script:
  - .travis/script

after_script:
  - .travis/after_script

before_deploy:
  - .travis/before_deploy

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-device"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
    condition: "$TRAVIS_OS_NAME != osx"
