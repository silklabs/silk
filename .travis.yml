language: objective-c

osx_image: xcode6.4

before_install:
  # Update brew twice because the first run can fail: https://github.com/Homebrew/homebrew/issues/42553
  - brew update; brew update
 
install:
  - brew reinstall gradle flow watchman xctool
  - npm install

branches:
  only:
    - master

env:
  matrix:
    - TEST_TYPE=objc-test
    - TEST_TYPE=build-dist
  global:
    - PROJECT=Silk
    # Debug or Release
    - CONFIGURATION=Debug
    # Single quotes needed so that YAML doesn't escape the colon
    - 'DEVELOPER_NAME="iPhone Developer: Silk Stooge (DPVPFYSNHB)"'
    - PROFILE_NAME="CI_Build_Profile"
    # Passphrase for .travis/certs/stooge.p12, created via
    # `travis encrypt 'KEY_PASSWORD=...' add`
    # The passphrase is set when exporting the private key from Keychain.
    - secure: 

before_script:
  - .travis/add-key.sh

script:
  - .travis/script

after_script:
  - .travis/remove-key.sh

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-app"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
