language: c
compiler: gcc
jdk:
  - openjdk7

cache:
  directories:
    - $HOME/.ccache

addons:
  apt:
    packages:
      - g++
      - libc6:i386
      - libstdc++6:i386
      - linux-libc-dev

env:
  global:
    - BUILD_HOST_64bit=1
    - REPO_INIT_ARGS="--depth=1"

before_script:
  - ccache -s
  - git config --global user.email "engineering@silklabs.com"
  - git config --global user.name "Travis CI"
  - git config --global color.ui false
  - nvm install 0.12
  - jdk_switcher use openjdk7
  - $TRAVIS_PULL_REQUEST || make init.mako
  - make sync
  - cp -v $(which ccache) prebuilts/misc/linux-x86/ccache/ccache
  - df -h

script:
  - if $TRAVIS_PULL_REQUEST; then make -j2; else make -j2 otapackage; fi

after_script:
  - ccache -s

notifications:
  email:
    - engineering@silklabs.com

before_deploy:
  - source build/envsetup.sh && ./gonk/archive.sh mako dist
  - mv --verbose out/target/product/mako/*ota*.zip dist/

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-device"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest

