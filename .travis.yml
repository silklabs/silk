language: c
compiler: gcc

cache:
  directories:
    - $HOME/.ccache
    - .repo/projects
    - .repo/project-objects

addons:
  apt:
    packages:
      - g++
      - libc6:i386
      - libstdc++6:i386
      - linux-libc-dev

before_script:
  - ccache -s
  - git config --global user.email "engineering@silklabs.com"
  - git config --global user.name "Travis CI"
  - git config --global color.ui false
  - nvm install 0.12
  - if [[ $TRAVIS_PULL_REQUEST == false ]]; then make init.base ; fi
  - make sync
  - cp $(which ccache) prebuilts/misc/linux-x86/ccache/ccache

script:
  - BUILD_HOST_64bit=1 make

after_script:
  - ccache -s

notifications:
  email:
    - engineering@silklabs.com

before_deploy:
  - echo "before_deploy"

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-device"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: out/target/product/generic/system
  upload-dir: $TRAVIS_BRANCH/latest

