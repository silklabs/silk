language: java
sudo: required
dist: trusty

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - g++-4.8
      - lib32stdc++6
      - lib32z1

env:
  global:
    - JAVA_OPTS=-Xmx512m
    - CXX=g++-4.8

install:
  - ../app/android/travis/install
  - ../app-sdk/install.sh

script: ../app/android/travis/script
