language: objective-c

osx_image: xcode7.3

install:
  - ../app/ios/travis/install
  - ../app-sdk/install.sh

before_script:
  - node --version
  - npm --version

env:
  global:
    - CONFIGURATION=Debug
    - PROJECT=SilkAppSDKExample
    - 'SCHEME="SilkAppSDKExample (local)"'
    - RCT_NO_LAUNCH_PACKAGER=1

script: >
  xcodebuild
  -project ios/$PROJECT.xcodeproj
  -scheme "$SCHEME"
  -configuration $CONFIGURATION
  -sdk iphonesimulator
  build
