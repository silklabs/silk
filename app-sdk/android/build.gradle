apply plugin: "com.android.library"
apply plugin: "maven"

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.3"
    // TODO: re-enable this https://github.com/silklabs/silk-core/issues/3022
    //publishNonDefault true

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }
}

project.ext.silkRootDir = file("../../")
project.ext.jsBundleEntryFile = "app-sdk/src/index.js"
project.ext.jsBundleDirRelease = file("$buildDir/intermediates/bundles/release/assets")
project.ext.jsBundleDirDebug = file("$buildDir/intermediates/bundles/debug/assets")
apply from: "${silkRootDir}/app-config/android/bundle.gradle"


dependencies {
    compile "com.android.support:appcompat-v7:23.0.1"
    compile "com.facebook.react:react-native:+"  // from node_modules
    compile project(':silk-app-util')
    compile project(':silk-ble-socket')
    compile project(':silk-crypto')
    compile project(':silk-react-native-blobs')
    compile project(':RCTWebRTC')
}

group "com.silklabs.react"

uploadArchives {
    repositories {
        mavenDeployer {
            repository(url: "file://${project.silkRootDir}/m2-local")
            pom.project {
                artifactId "app-sdk"
                packaging "aar"
            }
        }
    }
}
