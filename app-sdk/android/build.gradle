apply plugin: "com.android.library"
apply plugin: "maven"

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.3"
    publishNonDefault true

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }
}

project.ext.silkRootDir = file("../../")
project.ext.jsBundleEntryFile = "app-sdk/src/index.js"
project.ext.jsBundleDirRelease = file("$buildDir/intermediates/bundles/release/assets")
project.ext.jsBundleDirDebug = file("$buildDir/intermediates/bundles/debug/assets")
apply from: "${silkRootDir}/app-config/android/bundle.gradle"


dependencies {
    compile "com.android.support:appcompat-v7:23.0.1"
    compile "com.facebook.react:react-native:+"  // from node_modules
    compile fallback(project(':silk-app-util'), 'com.silklabs.react:app-util:+')
    compile fallback(project(':silk-ble-socket'), 'com.silklabs.react:ble-socket:+')
    compile fallback(project(':silk-crypto'), 'com.silklabs.react:crypto:+')
    compile fallback(project(':silk-react-native-blobs'), 'com.silklabs.react:blobs:+')
    compile fallback(project(':RCTWebRTC'), 'com.oney.react:webrtc:+')
}

uploadArchives {
    repositories {
        mavenDeployer {
            repository(url: "file://${project.silkRootDir}/m2-local")
            pom.project {
                groupId = "com.silklabs.react"
                artifactId "app-sdk"
            }
        }
    }
}
