def sdkProjectDir = project(":silk-app-sdk").projectDir
def silkRoot = file("$sdkProjectDir/../..")

project.ext.react = [
  root: "$silkRoot",
  entryFile: "app-sdk/src/index.js",
  bundleInDebug: true,
  bundleInRelease: true,
  inputExcludes: [
    "**/node_modules/**",
    "bsp-gonk/**",
    "device/**",
    "pub/bsp-gonk/**",
    "sim/**",
    "tools/heroku/**",
    "webapp/**",
  ],
  extraPackagerArgs: ["--verbose"]
]

apply from: "$silkRoot/node_modules/react-native/react.gradle"
