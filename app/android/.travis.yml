language: android

android:
  components:
    - tools
    - platform-tools
    - build-tools-23.0.2
    - android-23
    - extra-android-m2repository
    - extra-android-support

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - g++-4.8

env:
  global:
    - JAVA_OPTS=-Xmx512m
    - CXX=g++-4.8

install:
  - android/.travis/install

script:
  - cd android && .travis/script

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-app"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: app/build/outputs/apk/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
    condition: "$TRAVIS_PULL_REQUEST = false"
