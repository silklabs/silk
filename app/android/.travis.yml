language: java
sudo: required
dist: trusty

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - g++-4.8
      - lib32stdc++6
      - lib32z1

env:
  global:
    - JAVA_OPTS=-Xmx512m
    - CXX=g++-4.8

install: android/.travis/install
script: android/.travis/script

deploy:
  provider: s3
  access_key_id: $S3_ACCESS_KEY_ID
  secret_access_key: $S3_SECRET_ACCESS_KEY
  bucket: "silk-app"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: app/build/outputs/apk/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
    condition: "$TRAVIS_PULL_REQUEST = false"
