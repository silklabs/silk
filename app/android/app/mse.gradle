def config = project.hasProperty("react") ? project.react : [];

// because elvis operator
def elvisFile(thing) {
    return thing ? file(thing) : null;
}

void runBefore(String dependentTaskName, Task task) {
    Task dependentTask = tasks.findByPath(dependentTaskName);
    if (dependentTask != null) {
        dependentTask.dependsOn task
    }
}

gradle.projectsEvaluated {
    // Grab all build types and product flavors
    def buildTypes = android.buildTypes.collect { type -> type.name }
    def productFlavors = android.productFlavors.collect { flavor -> flavor.name }

    // When no product flavors defined, use empty
    if (!productFlavors) productFlavors.add('')

    productFlavors.each { productFlavorName ->
        buildTypes.each { buildTypeName ->
            // Create variant and target names
            def targetName = "${productFlavorName.capitalize()}${buildTypeName.capitalize()}"
            def targetPath = productFlavorName ?
                    "${productFlavorName}/${buildTypeName}" :
                    "${buildTypeName}"

            // React js bundle directories
            def jsBundleDirConfigName = "jsBundleDir${targetName}"
            def jsBundleDir = elvisFile(config."$jsBundleDirConfigName") ?:
                    file("$buildDir/intermediates/assets/${targetPath}")

            def repoRoot = file("../../../")
            def appRoot = file("../../")
            def androidDir = file("../")

            def generateMSEWebViewTaskName = "generateMSEWebView${targetName}Js"

            def currentTask = tasks.create(
                    name: generateMSEWebViewTaskName,
                    type: Exec) {
                group = "react"
                description = "bundle MSE webview JS for ${targetName}."

                doFirst {
                    jsBundleDir.mkdirs()
                }

                workingDir androidDir
                commandLine "$repoRoot/node_modules/.bin/webpack", "--output-path", jsBundleDir

                if (targetName.toLowerCase().contains("release")) {
                  environment CONFIGURATION: "Release"
                }

                enabled true
            }

            currentTask.dependsOn("merge${targetName}Assets")

            runBefore("processArmeabi-v7a${targetName}Resources", currentTask)
            runBefore("processX86${targetName}Resources", currentTask)
            runBefore("processUniversal${targetName}Resources", currentTask)
            runBefore("process${targetName}Resources", currentTask)
        }
    }
}
