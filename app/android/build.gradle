// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        if (System.env.MAVEN_REMOTE_REPO) {
            maven { url System.env.GRADLE_MAVEN_REPO }
        } else {
            maven { url "../../m2-remote" }
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.2.0'
    }
}

def silkRootDir = file("../../")

allprojects {
    repositories {
        if (System.env.MAVEN_REMOTE_REPO) {
            maven { url System.env.MAVEN_REMOTE_REPO }
        } else {
            maven { url "$silkRootDir/m2-remote" }
        }
        maven { url "$silkRootDir/node_modules/react-native/android" }
    }
}
