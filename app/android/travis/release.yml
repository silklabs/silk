language: java
sudo: required
dist: trusty

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
    packages:
      - g++-4.8
      - lib32stdc++6
      - lib32z1

env:
  global:
    - JAVA_OPTS=-Xmx512m
    - CXX=g++-4.8

install:
  - android/travis/install
  - ./install.sh

script: android/travis/script
after_success: android/travis/after_success
