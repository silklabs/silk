language: objective-c

osx_image: xcode7.3

install:
  - export FULL_SERVICE=1
  - ios/travis/install
  - ./install.sh

env:
  matrix:
    - TEST_TYPE=objc-test
    - TEST_TYPE=build-dist
  global:
    - PROJECT=Silk
    - CONFIGURATION=Debug
    - RCT_NO_LAUNCH_PACKAGER=1

before_script:
  - node --version
  - npm --version
  - source ../releng/certs/ios/env.sh
  - ../releng/certs/ios/setup.sh

script:
  - ios/travis/script

after_script:
  - ../releng/certs/ios/teardown.sh
  - ios/travis/raygun-dsym.sh

after_success: 
  - ios/travis/after_success
