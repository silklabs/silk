language: objective-c

osx_image: xcode7.3

before_install:
  # Update brew twice because the first run can fail:
  # https://github.com/Homebrew/homebrew/issues/42553
  - brew update; brew update

install:
  - export FULL_SERVICE=1
  - ios/travis/install
  - ./install.sh

env:
  global:
    - TEST_TYPE=build-dist
    - CONFIGURATION=Release

before_script:
  - node --version
  - npm --version
  - source ios/travis/env.sh
  - ios/travis/add-key.sh

script:
  - ios/travis/script

after_script:
  - ios/travis/remove-key.sh
  - ios/travis/raygun-dsym.sh

deploy:
  provider: s3
  access_key_id: $S3_ACCESS_KEY_ID
  secret_access_key: $S3_SECRET_ACCESS_KEY
  bucket: "silk-app"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
