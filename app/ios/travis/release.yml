language: objective-c

osx_image: xcode7.3

install:
  - export FULL_SERVICE=1
  - ios/travis/install
  - ./install.sh

env:
  global:
    - TEST_TYPE=build-dist
    - CONFIGURATION=Release

before_script:
  - node --version
  - npm --version
  - source ios/travis/env.sh
  - ios/travis/add-key.sh

script:
  - ios/travis/script

after_script:
  - ios/travis/remove-key.sh
  - ios/travis/raygun-dsym.sh

after_success: 
  - ios/travis/after_success
