apply plugin: "com.android.library"
apply plugin: "maven"

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.3"
    // TODO: re-enable this https://github.com/silklabs/silk-core/issues/3022
    //publishNonDefault true
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }
    productFlavors {
    }
}

dependencies {
    compile 'com.android.support:appcompat-v7:23.0.1'
    compile 'org.altbeacon:android-beacon-library:2.9.1'
    compile 'com.facebook.react:react-native:+'  // from node_modules
}

group = "com.silklabs.react"

uploadArchives {
    repositories {
        mavenDeployer {
            def silkRootDir = file("../../")
            repository(url: "file://$silkRootDir/m2-local")
            pom.project {
                artifactId "ble-socket"
                packaging "aar"
            }
        }
    }
}
