apply plugin: "com.android.library"
apply plugin: "maven"

android {
    compileSdkVersion 23
    buildToolsVersion "23.0.3"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "armeabi-v7a", "x86"
        }
    }
}

dependencies {
    // Android SDK
    compile "com.android.support:appcompat-v7:23.0.1"

    // local dependencies
    compile "com.facebook.react:react-native:+"
    compile "com.github.joshjdevl.libsodiumjni:libsodium-jni-aar:1.0.2-SNAPSHOT"

    // third-party dependencies
    compile 'com.madgag.spongycastle:core:1.54.0.0'
    compile 'com.madgag.spongycastle:prov:1.54.0.0'
    compile 'com.madgag.spongycastle:pkix:1.54.0.0'
}

group = "com.silklabs.react"

uploadArchives {
    repositories {
        mavenDeployer {
            def silkRootDir = file("../../")
            repository(url: "file://$silkRootDir/m2-local")
            pom.project {
                artifactId "crypto"
                packaging "aar"
            }
        }
    }
}
