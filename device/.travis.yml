language: generic
sudo: required
dist: trusty

# Note that OS X builds are triggered periodically by Releng
os:
  - linux

jdk:
  - openjdk7

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
      - kubuntu-backports
    packages:
      - bc
      - g++-4.8
      - g++-4.8-multilib
      - libcv-dev
      - libcvaux-dev
      - libhighgui-dev
      - libopencv-dev
      - linux-libc-dev
      - openjdk-7-jdk
      - openjdk-7-jre-headless

install:
  - source ../releng/.travis_before_install.sh
  - export CXX="g++-4.8" CC="gcc-4.8"

before_script:
  source travis/before_script

script:
  - echo For full build logs and other artifacts, please see $ARTIFACT_WEBHOST/$ARTIFACT_REMOTE_PATH
  - travis/log travis/script

after_success:
  travis/after_success

after_script:
  travis/after_script

before_deploy:
  travis/before_deploy

deploy:
  provider: s3
  access_key_id: "AKIAIASNJWAY2EBXDKRA"
  secret_access_key: "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"
  bucket: "silk-device"
  region: us-west-2
  skip_cleanup: true
  acl: public_read
  local-dir: dist/
  upload-dir: $TRAVIS_BRANCH/latest
  on:
    all_branches: true
    condition: "$TRAVIS_PULL_REQUEST/$TRAVIS_OS_NAME == false/linux"
