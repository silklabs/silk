language: generic
sudo: required
dist: trusty

# Note that OS X builds are triggered periodically by Releng
os:
  - linux

jdk:
  - openjdk7

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
      - kubuntu-backports
    packages:
      - bc
      - g++-4.8
      - g++-4.8-multilib
      - libcv-dev
      - libcvaux-dev
      - libhighgui-dev
      - libopencv-dev
      - linux-libc-dev
      - openjdk-7-jdk
      - openjdk-7-jre-headless
      - realpath

before_install:
  - source ../pub/travis/common_before_install.sh
  - export CXX="g++-4.8" CC="gcc-4.8"

before_script:
  source travis/before_script

script:
  - echo For full build logs and other artifacts, please see $ARTIFACT_WEBHOST/$ARTIFACT_REMOTE_PATH
  - travis/log travis/script

after_success:
  travis/after_success

after_script:
  travis/after_script
