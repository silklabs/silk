language: generic
sudo: required
dist: trusty

os:
  - linux

# Pay close attention here ideally this should match prerequisites-linux.md
addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
      - kubuntu-backports
    packages:
      - m4
      - libxml2-utils
      - cmake
      - lib32z1
      - lib32stdc++6
      - libc6-dev-i386
      - linux-libc-dev
      - g++
      - g++-4.8
      - g++-4.8-multilib
      - libcv-dev
      - libcvaux-dev
      - libhighgui-dev
      - libopencv-dev
      - realpath

install:
  - source ../../../pub/travis/common_before_install.sh
  - source ../../../setup
# nasty hack to make node-kissfft always present in the tree ...
  - git clone git@github.com:silklabs/node-kissfft.git ../../external/node-kissfft
  - core/install.sh

script:
  - ./travis/script
