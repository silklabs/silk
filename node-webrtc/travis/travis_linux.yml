language: generic
sudo: required
dist: trusty

# Note that OS X builds are triggered periodically by Releng
os:
  - linux

jdk:
  - openjdk7

addons:
  apt:
    sources:
      - ubuntu-toolchain-r-test
      - kubuntu-backports
    packages:
      - libpulse-dev
      - pulseaudio
      - libasound2
      - libasound2-dev
      - ninja-build
      - binutils
      - bc
      - libgtk2.0-dev
      - g++-4.8
      - g++-4.8-multilib
      - linux-libc-dev
      - openjdk-7-jdk
      - openjdk-7-jre-headless
      - realpath

before_install:
  - source ../pub/travis/common_before_install.sh
  - export CXX="g++-4.8" CC="gcc-4.8"
  - ../ci/ccache_pull.sh

script:
  - ./bin/build.sh && npm test

after_script:
  - ../ci/ccache_push.sh
  - ../ci/native_node_build_push.sh



