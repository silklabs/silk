<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Silk Diag</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
      /* keep scrollbars - http://simurai.com/blog/2011/07/26/webkit-scrollbar/ */
      ::-webkit-scrollbar {
        -webkit-appearance: none;
        width: 7px;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 4px;
        background-color: rgba(0,0,0,.5);
        box-shadow: 0 0 1px rgba(255,255,255,.5);
      }
      html, body {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }
      #cameras {
        min-width: 150px;
      }
      .log {
        font-family: monospace;
        overflow-y: scroll;
        overflow-x: hidden;
        margin: 2px;
        padding: 5px;
        border-style: solid;
        border-color: #D3D3D3;
        border-width: 2px;
      }
      #dash {
        height: 150px;
      }
      #procrank {
        height: 200px;
      }
      #logcat {
        height: calc(100% - 455px);
      }
    </style>
  </head>
  <body>
    <script type="text/javascript" src="../config.local.js"></script>

    <select id='cameras' onChange='cameras.updateActive();'></select>

    <label><input type='checkbox' id='procrankEnable' checked
      onclick='updateLogEnable("procrank");'>procrank</label>

    <label><input type='checkbox' id='logcatEnable' checked
      onclick='updateLogEnable("logcat");'>logcat</label>

    <label><input type='checkbox' id='pauseLogcat'
      onclick='updatePauseLogcat();'>pause logcat (press t to toggle)</label>

    <pre id='dash' class='log'></pre>
    <pre id='procrank' class='log'></pre>
    <div id='logcat' class='log'></div>

    <script type="text/javascript" src="../js/bundle.js"></script>
  </body>
</html>
