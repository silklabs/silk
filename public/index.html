<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Silk Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
      html, body {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
      }

      #toolbar > span {
        background-color: #888888;
        color: white;
        padding: 5px 10px 5px 10px;
        text-align: center;
        cursor: pointer;
        min-width: 9mm;
        min-height: 9mm;
      }

      #monitors {
        background-color: gray;
        width: 100%;
        height: 90%;
      }

      #video {
        position: absolute;
        left: 50px;
        top: 50px;
        display: none;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.socket.io/socket.io-1.3.6.js"></script>
    <script type="text/javascript" src="js/silk-api.js"></script>
    <div id='log'>
    </div>
    <div id="monitors">
    </div>
    <video id="video" autoplay>
    </video>
    <div id='toolbar'>
      <span onclick='toggleLog();'>Toggle</span>
      <span onclick='restart();'>Restart</span>
      <span onclick='start();'>Start</span>
      <span onclick='stop();'>Stop</span>
      <input id="lightIntensity" type="range"
             value="1.0" min="0.0" max="1.0" step="0.01"></input>
      <input id="lightOn" type="checkbox"></input>
      <span onclick='light();'>Light</span>
      <a href="/diag/">Silk Diag</a>
    </div>
    <script type="text/javascript" src="js/silk.js"></script>
  </body>
</html>
