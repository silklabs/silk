os:
  - linux

before_install:
  - source .travis_before_install.sh

script:
  - npm run lint && npm run flow

before_deploy:
  - cd ..
  - mkdir -p deploy/

deploy:
  - provider: s3
    access_key_id: "AKIAIASNJWAY2EBXDKRA"
    secret_access_key: "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"
    bucket: "silk-releng-us-east-1"
    region: us-east-1
    skip_cleanup: true
    acl: public_read
    local-dir: deploy/
    upload-dir: $TRAVIS_BRANCH
    on:
      condition: $DEPLOY = true
  - provider: heroku
    api_key:
      secure: ""
    app:
      master: silk-releng
    on:
      branch: master
      condition: "$TRAVIS_PULL_REQUEST/$DEPLOY == false/false"

