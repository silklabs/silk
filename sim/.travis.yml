language: generic
os:
  - osx

before_install:
  - source ../pub/travis/common_before_install.sh
  - brew tap homebrew/science
  - brew install --verbose opencv3
  - cp /usr/local/Cellar/opencv3/3.1.0_*/share/OpenCV/3rdparty/lib/libippicv.a /usr/local/Cellar/opencv3/3.1.0_*/lib/
  - brew link --force --overwrite opencv3
  - pkg-config --modversion opencv
  - source ../setup
  - ../install.sh

install:
script: npm test
