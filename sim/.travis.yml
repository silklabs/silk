language: generic
os:
  - osx

before_install:
  - brew update
  - brew reinstall coreutils nvm xz
  - export NVM_DIR="$PWD/.nvm"
  - source $(brew --prefix nvm)/nvm.sh
  - npm config set spin=false
  - nvm install 4.2
  - brew tap homebrew/science
  - brew install --verbose opencv3 --with-contrib
  - cp /usr/local/Cellar/opencv3/3.1.0_*/share/OpenCV/3rdparty/lib/libippicv.a /usr/local/Cellar/opencv3/3.1.0_*/lib/
  - brew link --force --overwrite opencv3
  - pkg-config --modversion opencv
  - source ../setup

install: npm install
script: npm test
